version: '3.8'

services:
  wastieego-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: wastieego/wastieego-app:v1-UTS
    container_name: wastieego-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # kunci penanda sesi penyelenggara: isi lewat file .env, lihat .env.example
      - SESSION_SECRET=${SESSION_SECRET:?Isi SESSION_SECRET di file .env}
      - DATA_DIR=/app/data
    volumes:
      - wastieego-data:/app/data

volumes:
  wastieego-data:
